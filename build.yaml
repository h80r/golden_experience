# Build configuration for code generation
targets:
  $default:
    builders:
      # Drift SQL database code generation
      drift_dev:
        enabled: true
        options:
          skip_verification_code: false
          use_data_class_name_for_companions: true

      # Freezed for immutable data classes
      freezed:
        enabled: true

      # Riverpod code generation
      riverpod_generator:
        enabled: true
